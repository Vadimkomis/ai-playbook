name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the candidate formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew tap ai-playbook-test/tap "$GITHUB_WORKSPACE"
          brew install --build-from-source ai-playbook-test/tap/ai-playbook
      - run: brew test ai-playbook-test/tap/ai-playbook
      - run: brew style ai-playbook-test/tap/ai-playbook
