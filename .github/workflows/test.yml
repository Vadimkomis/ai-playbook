name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and verify the candidate with Homebrew updates enabled
        env:
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: node scripts/verify-homebrew.js
      - name: Retain Homebrew installation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-install-log
          path: .tmp/homebrew-install.log
